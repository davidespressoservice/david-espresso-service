<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Coffee - David Espresso</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .product {
      max-width: 400px;
      margin: 0 auto 30px auto;
      padding: 20px;
      border: 1px solid #444;
      border-radius: 10px;
      text-align: center;
      background-color: #111;
    }
    .product img {
      width: 100%;
      border-radius: 10px;
    }
    button {
      padding: 12px 25px;
      font-size: 16px;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #f39c12;
      color: #000;
      font-weight: bold;
    }
    input[type="text"] {
      padding: 8px;
      width: 80px;
      font-size: 16px;
      margin: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    #totals {
      font-size: 18px;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>David Espresso Shop</h1>

  <div class="product">
    <img src="caffeismo1.jpg" alt="Caffè 1kg">
    <h2>Caffè 1kg</h2>
    <p>Prezzo standard: $50 AUD</p>
    <label for="postcode">CAP Destinazione:</label>
    <input type="text" id="postcode" value="3049">
    <button id="calculateShippingBtn">Calcola Spedizione</button>
    <p id="shippingCost">Costo spedizione: $0</p>
    <p id="totals">Totale: $50</p>
    <button id="checkoutBtn">Paga con Stripe</button>
  </div>

  <script>
    const coffeePrice = 50; // prezzo standard

    const shippingCostEl = document.getElementById('shippingCost');
    const totalsEl = document.getElementById('totals');

    document.getElementById('calculateShippingBtn').addEventListener('click', async () => {
      const to_postcode = document.getElementById('postcode').value;
      const length = 22;  // dimensioni box
      const width = 16;
      const height = 7.7;
      const weight = 1.5;

      try {
        const res = await fetch(/calculate-shipping?to_postcode=${to_postcode}&length=${length}&width=${width}&height=${height}&weight=${weight});
        const data = await res.json();
        shippingCostEl.innerText = Costo spedizione: $${data.cost};
        totalsEl.innerText = Totale: $${(coffeePrice + data.cost).toFixed(2)};
      } catch (err) {
        console.error(err);
        shippingCostEl.innerText = Errore calcolo spedizione;
      }
    });

    document.getElementById('checkoutBtn').addEventListener('click', async () => {
      const shippingText = shippingCostEl.innerText.split('$')[1] || 0;
      const totalAmount = coffeePrice + parseFloat(shippingText);

      try {
        const res = await fetch('/create-checkout-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: totalAmount })
        });
        const data = await res.json();
        const stripe = Stripe('pk_live_51T4DmbH72MNXg8CJo8hIkHsR7iXZdGCk1iXi0uGDRVlm0RVoQAFQ9zoYi1pGFirVJ1z72QxQScX13sEniMFPt2uy00zWcvWEIc'); // sostituisci con la tua pubblica
        stripe.redirectToCheckout({ sessionId: data.id });
      } catch (err) {
        console.error(err);
        alert('Errore pagamento');
      }
    });
  </script>

</body>
</html>
