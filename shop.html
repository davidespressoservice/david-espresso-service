<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>David Espresso Service - Shop</title>
<script src="https://js.stripe.com/v3/"></script>

<style>
/* --- DESIGN ORIGINALE --- */
body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: url('images/hero1.jpg') no-repeat center center fixed;
    background-size: cover;
    margin: 0;
    padding: 0;
    text-align: center;
    color: #333;
}

.container {
    background: rgba(255, 255, 255, 0.95);
    padding: 40px;
    max-width: 550px;
    margin: 80px auto;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h1 {
    font-size: 32px;
    margin-bottom: 25px;
    color: #222;
}

input, button {
    padding: 12px;
    margin: 10px 0;
    width: 90%;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    background: #000;
    color: #fff;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #333;
}

.total {
    font-size: 20px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">
    <h1>Buy Premium Coffee</h1>

    <label>Quantity (kg)</label>
    <input type="number" id="quantity" value="1" min="1">

    <label>Postcode</label>
    <input type="text" id="postcode" placeholder="Enter postcode">

    <button onclick="calculateTotal()">Calculate Total</button>

    <div class="total">
        Product: $<span id="productPrice">50</span><br>
        Shipping: $<span id="shippingCost">0</span><br>
        <strong>Total: $<span id="totalPrice">50</span></strong>
    </div>

    <button onclick="checkout()">Pay Now</button>
</div>

<script>
// --- BACKEND + STRIPE ---
const stripe = Stripe('pk_live_51T4DmbH72MNXg8CJo8hIkHsR7iXZdGCk1iXi0uGDRVlm0RVoQAFQ9zoYi1pGFirVJ1z72QxQScX13sEniMFPt2uy00zWcvWEIc'); // METTI QUI LA TUA CHIAVE PUBBLICA
const pricePerKg = 50;
let shippingCost = 0;

async function calculateTotal() {
    const qty = document.getElementById("quantity").value;
    const postcode = document.getElementById("postcode").value;

    const productTotal = qty * pricePerKg;
    document.getElementById("productPrice").innerText = productTotal;

    try {
        // Render backend endpoint per spedizione
        const response = await fetch(https://https://david-espresso-service-1.onrender.com/calculate-shipping?postcode=${postcode}&weight=${qty});
        const data = await response.json();
        shippingCost = data.cost || 0;
        document.getElementById("shippingCost").innerText = shippingCost;

        const total = productTotal + shippingCost;
        document.getElementById("totalPrice").innerText = total;

    } catch (err) {
        alert("Shipping calculation failed");
    }
}

async function checkout() {
    const total = document.getElementById("totalPrice").innerText;

    try {
        const response = await fetch('https://https://david-espresso-service-1.onrender.com/create-checkout-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount: total * 100 }) // Stripe usa centesimi
        });

        const session = await response.json();
        stripe.redirectToCheckout({ sessionId: session.id });

    } catch (err) {
        alert("Checkout failed");
    }
}
</script>

</body>
</html>
